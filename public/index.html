<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <script>
      // Localized tab title: follows the system language (UAS7 Diary / 蕁麻疹日記).
      (function () {
        function applyTitle() {
          try {
            var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            document.title = lang === 'zh' || lang.indexOf('zh-') === 0 ? '蕁麻疹日記' : 'UAS7 Diary';
          } catch (e) {}
        }
        applyTitle();
        try {
          window.addEventListener('languagechange', applyTitle);
        } catch (e) {}
      })();
    </script>
    <!-- PWA: installable web app -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="application-name" content="UAS7" />
    <meta name="apple-mobile-web-app-title" content="UAS7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // Register the service worker for offline support + installability.
      // Skipped on localhost so `expo start --web` development stays uncached.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const host = window.location.hostname;
          const isLocalhost =
            host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
          if (isLocalhost) return;
          navigator.serviceWorker.register('./sw.js').then(
            (registration) => {
              console.log('Service Worker registered with scope:', registration.scope);
            },
            (error) => {
              console.error('Service Worker registration failed:', error);
            }
          );
        });
      }
    </script>
  </body>
</html>
